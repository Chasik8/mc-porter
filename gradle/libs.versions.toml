[versions]
jackson = "3.2.3"
networknt = "3.0.8"
picocli = "4.7.7"
slf4j = "2.0.19"
junit = "6.1.3"
asm = "9.7.1"
mappingio = "0.7.1"
matcher = "0.1.0"

[libraries]
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
asm-util = { module = "org.ow2.asm:asm-util", version.ref = "asm" }
mapping-io = { module = "net.fabricmc:mapping-io", version.ref = "mappingio" }
fabric-matcher = { module = "net.fabricmc:matcher", version.ref = "matcher" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "networknt" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
