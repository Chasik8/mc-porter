schemaVersion: 1
id: feral-flare-floor
description: >-
  Feral Flare Lantern at [0,64,0] above a 16x16 stone floor at y=60 (chunk 0,0) in a void world: lights are placed
  in the floor's chunk where the block light is below 10 (above the floor, 4 over its surface, and under it); the
  void columns around stay empty (air-only sections). Spots come from the world RNG (different per version): the
  trace compares the lantern's settings and a fixed floor block, the assertions bound the light count.
  The plan touches the 5x5 chunks around the origin first (air at y=200): the testkit force-loads touched chunks, and
  both light engines only light a block when its neighbour chunks are loaded.
world: flat-void
maxTicks: 3000
tolerance:
  "*": { abs: 0 }
  "nbt:[0,64,0]/lights": { ignore: true }
  "nbt:[0,64,0]/ticks": { ignore: true }
steps:
