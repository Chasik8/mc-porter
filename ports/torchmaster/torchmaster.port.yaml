# TorchMaster 19.2.93 (Forge 1.19.2, MIT, xalcon) -> Forge 1.7.10, full mode: the whole mod is ported.
# Run it with `ports/torchmaster/run.sh` (Linux) or `run.bat` (Windows), i.e. `porter run ports/torchmaster`: porter
# checks the files under inputs:, does the one-time setup, runs the prepare: steps and then `porter port` with this file.
# ${RUN_DIR}, ${PORTER_CACHE}, ${GRADLE_USER_HOME}, ${BUILD_JAVA_HOME} and ${INPUT_*} are defined by `porter run`
# (contracts/rfc/007-port-inputs-and-run.md).
schemaVersion: 1
name: torchmaster
description: Unofficial 1.7.10 port of Torchmaster (Mega Torch, Dread Lamp, Feral Flare Lantern, Frozen Pearl).
mode: full
from: forge-1.19.2
to: forge-1.7.10
project: ${RUN_DIR}/project
inputs:
  # the mod's source at the commit of version 19.2.93 (MIT licence: porter fetches it itself)
  - name: source
    mod: Torchmaster
    version: 19.2.93
    kind: sources
    page: https://github.com/Xalcon/TorchMaster/tree/f21e231d790d04beb86aa35392826dccededf614
    file: TorchMaster-f21e231d.zip
    sha256: 75be907f0fe9e30ed58fc584c35e10a7bd6fb1f8c7837425d73499db5093ba0d
    url: https://github.com/Xalcon/TorchMaster/archive/f21e231d790d04beb86aa35392826dccededf614.zip
  # the release jar: the 1.19.2 side of the scenario checks (run with --verify, contributors only); the port itself does not need it
  - name: original
    mod: Torchmaster
    version: 19.2.93
    page: https://modrinth.com/mod/torchmaster/version/19.2.93
    file: torchmaster-19.2.93.jar
    sha256: 9c82c26524491013fb4c81809331b3a2ff5eb9ff76a969d5f8b6fdbf179d4e30
    optional: true
prepare:
  # declarative content: the IR (recipes, lang) and the converted textures
  - name: extract
    args: [extract, --src, "${INPUT_SOURCE_DIR}", --version, "1.19.2", --mc-data, "${PORTER_CACHE}/mappings-1.19.2", --out, "${RUN_DIR}/project/build/porter-ir"]
  - name: assets
    args: [assets, --src, "${INPUT_SOURCE_DIR}/src/main/resources", --from, "1.19.2", --to, "1.7.10", --out, "${RUN_DIR}/project/build/porter-assets",
           --ir, "${RUN_DIR}/project/build/porter-ir", --legacy-names, NS_CAMEL]
jvmArgs: [-Xmx2g]
classpath:
  file: build/porter-cp.txt
  exclude: [jabel]
generate:
  units:
    # declarative content from the IR (porter extract + porter assets, README step 2): recipes, lookup, lang,
    # textures. Blocks, items and the block entity are registered by the ported code itself (DeferredRegister
    # adapter), so the generated registration, bases and stubs are not installed.
    - name: content
      args: [--version, "1.7.10", --ir, "${RUN_DIR}/project/build/porter-ir", --assets, "${RUN_DIR}/project/build/porter-assets",
             --modid, torchmaster, --mod-name, "Torchmaster (unofficial 1.7.10 port)", --mod-version, 19.2.93-port.1,
             --package, net.xalcon.torchmaster.gen, --legacy-names, NS_CAMEL, --no-nei, --no-stubs]
      exclude:
        - src/main/java/net/xalcon/torchmaster/gen/TorchmasterContent.java
        - src/main/java/net/xalcon/torchmaster/gen/TorchmasterMod.java
        - src/main/java/net/xalcon/torchmaster/gen/TorchmasterGuiHandler.java
        - src/main/java/net/xalcon/torchmaster/gen/client/TorchmasterClientEvents.java
        - src/main/java/net/xalcon/torchmaster/gen/block/DreadlampBlockBase.java
        - src/main/java/net/xalcon/torchmaster/gen/block/FeralFlareLanternBlockBase.java
        - src/main/java/net/xalcon/torchmaster/gen/block/InvisibleLightBlockBase.java
        - src/main/java/net/xalcon/torchmaster/gen/block/MegatorchBlockBase.java
        - src/main/java/net/xalcon/torchmaster/gen/item/FrozenPearlItemBase.java
        - src/main/java/net/xalcon/torchmaster/gen/tile/FeralFlareLanternTileBase.java
        - src/main/resources/assets/torchmaster/textures/blocks/feral_flare_lantern.psd
        - src/main/resources/assets/torchmaster/textures/blocks/mega_torch.psd
        - src/main/resources/assets/torchmaster/textures/blocks/mega_torch_top.psd
        - src/main/resources/mcmod.info
closure:
  source: ${INPUT_SOURCE_DIR}/src/main/java
  prefixes: [net.xalcon.torchmaster.]
  # the mod class and the event subscriber (found by annotation, referenced by no class) reach all 28 classes
  seeds: [net.xalcon.torchmaster.Torchmaster, net.xalcon.torchmaster.common.logic.entityblocking.EntityBlockingEventHandler]
rewrite:
  rules: [../../rules/composite, ../../rules/packs/adapters]
  graph: ["${PORTER_CACHE}/graph/out"]
  shimPackage: net.xalcon.torchmaster.shim
  classpath:
    - "${PORTER_CACHE}/forge-1.19.2-compile/mc-forge-1.19.2-client-mojmap.jar"
    - "${PORTER_CACHE}/forge-1.19.2-client/libraries/**/*.jar"
  jvmArgs: [-Xmx3g, -Xss16m]
  # full 1.19.2 supertype table (rewrite/scripts/typefacts_from_jars.py, README step 1)
  args: [--type-facts, "${PORTER_CACHE}/typefacts-1.19.2/forge-1.19.2-43.5.2.tsv"]
install:
  passes: [java8, tector, imports]
  adapters: bundled
  # the 1.7.10 @Mod entry point (wiring): runs the ported 1.19.2 mod constructor inside the FML lifecycle
  overlays: [overlay]
compile:
  options: [--release, "8", -Xplugin:jabel]
  processorpath: ["${GRADLE_USER_HOME}/caches/modules-2/files-2.1/com.github.GTNewHorizons/jabel-javac-plugin/**/*.jar",
                  "${GRADLE_USER_HOME}/caches/modules-2/files-2.1/net.bytebuddy/**/*1.14.9.jar"]
  jvmArgs: [-Xmx1500m]
build:
  command: [./gradlew, --no-daemon, build]
  env: { JAVA_HOME: "${BUILD_JAVA_HOME}", GRADLE_USER_HOME: "${GRADLE_USER_HOME}" }
  jar: build/libs/torchmaster-0.1.0.jar
  obfcheckPrefix: net/xalcon/
test:
  runs:
    # all six scenarios in ONE call: porter runs the server scenarios of a version in one Minecraft launch
    # (two launches in total: 1.19.2 original, 1.7.10 port); one run per scenario would be 12 launches
    - name: scenarios
      args: [test, diff, --scenario, scenarios, --a, "${INPUT_ORIGINAL}", --b, "${RUN_DIR}/project/build/libs/torchmaster-0.1.0.jar", --ir, "${RUN_DIR}/project/build/porter-ir"]
