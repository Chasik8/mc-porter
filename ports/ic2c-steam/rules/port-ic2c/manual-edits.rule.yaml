schemaVersion: 1
id: r-closure-ic2c-decl-ihasinventory-slotaccess
description: "IHasInventory bridges to the adapter raw slot access (was manual edit #3)"
from: forge-1.19.2
to: forge-1.7.10
kind: idiom
match:
  declaration: "ic2.core.inventory.base.IHasInventory"
edit:
  addSupertypes: ["dev.porter.shim.mc.ModernTileEntity.SlotAccess"]
  addMembers: "\n    default int porterSlotCount() { return getSlotCount(); }\n\n    default ItemStack porterGetSlot(int slot) { return getInventoryStack(slot); }\n\n    default void porterSetSlot(int slot, ItemStack stack) { setStackInSlot(slot, stack); }\n"
confidence: 0.9
provenance: { source: manual, ref: "edits/manual-edits.yaml #3" }
tests:
  - before: "public interface IHasInventory {\n    public int getSlotCount();\n}"
    after: "public interface IHasInventory extends dev.porter.shim.mc.ModernTileEntity.SlotAccess {\n    default int porterSlotCount() { return getSlotCount(); }\n\n    default ItemStack porterGetSlot(int slot) { return getInventoryStack(slot); }\n\n    default void porterSetSlot(int slot, ItemStack stack) { setStackInSlot(slot, stack); }\n\n    public int getSlotCount();\n}"
---
