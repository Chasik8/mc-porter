to: forge-1.7.10
kind: idiom
match:
  pattern: "($item = ($s = $e).getItem()) instanceof IFuelableItem && !($f = (IFuelableItem) $item).hasFuel($s)"
replace: "($f = ic2cextras.ported.compat.Ic2HostItems.fuelable($s = $e)) != null && !$f.hasFuel($s)"
preconditions: ["in-subtype-of:ic2.core.block.generators.tiles.FuelBoilerTileEntity"]
confidence: 0.9
provenance: { source: manual, ref: "edits/manual-edits.yaml #11" }
tests:
  - context: "extends ic2.core.block.generators.tiles.FuelBoilerTileEntity; Object item; Object stack; IFuelableItem fuel"
    before: "if ((item = (stack = (ItemStack) list.get(0)).getItem()) instanceof IFuelableItem && !(fuel = (IFuelableItem) item).hasFuel(stack)) { run(); }"
    after: "if ((fuel = ic2cextras.ported.compat.Ic2HostItems.fuelable(stack = (ItemStack) list.get(0))) != null && !fuel.hasFuel(stack)) { run(); }"
---
