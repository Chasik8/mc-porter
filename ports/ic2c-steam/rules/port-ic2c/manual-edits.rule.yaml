id: r-closure-ic2c-fuelboiler-refuel
description: "fuel boiler: refuel from a fuel container through the host fuel can (was manual edits #12, #13)"
from: forge-1.19.2
to: forge-1.7.10
kind: idiom
match:
  pattern: |
    Item $i2 = $s.getItem();
    if ($i2 instanceof IFuelableItem && ($it = (IFuelableItem) $i2).hasFuel($s)) $then;
replace: "if (($it = ic2cextras.ported.compat.Ic2HostItems.fuelable($s)) != null && $it.hasFuel($s)) $then"
preconditions: ["in-subtype-of:ic2.core.block.generators.tiles.FuelBoilerTileEntity"]
confidence: 0.9
provenance: { source: manual, ref: "edits/manual-edits.yaml #12, #13" }
tests:
  - context: "extends ic2.core.block.generators.tiles.FuelBoilerTileEntity; Object stack; IFuelableItem item"
    before: |
      Item other = stack.getItem();
      if (other instanceof IFuelableItem && (item = (IFuelableItem) other).hasFuel(stack)) {
          int added = item.amount(stack);
      }
    after: |
      if ((item = ic2cextras.ported.compat.Ic2HostItems.fuelable(stack)) != null && item.hasFuel(stack)) {
          int added = item.amount(stack);
      }
