schemaVersion: 1
id: r-ic2c-barrels-barrel-replaces-scaffold
description: "IC2C WoodenScaffoldBlock.canBeReplaced(barrel item) (the scaffold is the host's): the barrel item replaces a clicked wooden scaffold"
from: forge-1.19.2
to: forge-1.7.10
kind: idiom
match:
  declaration: "ic2.core.item.block.BarrelItem"
edit:
  appendMembers: "\n\n    @Override\n    public boolean replacesClicked(net.minecraft.world.World w, int x, int y, int z, net.minecraft.item.ItemStack s) {\n        return w.getBlock(x, y, z) == net.minecraft.block.Block.getBlockFromItem($target(ic2.core.Ic2Items).scaffold.getItem());\n    }"
confidence: 0.9
provenance: { source: agent, ref: "barrels closure port: host wooden scaffold" }
tests:
  - before: "public class BarrelItem {\n    int a;\n}"
    after: "public class BarrelItem {\n    int a;\n\n    @Override\n    public boolean replacesClicked(net.minecraft.world.World w, int x, int y, int z, net.minecraft.item.ItemStack s) {\n        return w.getBlock(x, y, z) == net.minecraft.block.Block.getBlockFromItem(ic2.core.Ic2Items.scaffold.getItem());\n    }\n}"

