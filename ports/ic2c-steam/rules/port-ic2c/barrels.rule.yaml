# Barrels / drinks on IC2 Classic 1.2.6: the empty mug is the host's (IC2:itemMugEmpty), not a 2.x MugItem; drink
# containers are seen through compat.Ic2HostItems.drinkContainer (a ported drink item, or the host empty mug as an
# unregistered MugItem). Tests are synthetic (only the owner names are the mod's).
schemaVersion: 1
id: r-ic2c-barrels-drink-container-test
description: "item instanceof IDrinkContainer -> the drink-container view exists (host empty mug included)"
from: forge-1.19.2
to: forge-1.7.10
kind: idiom
match:
  pattern: "$s.getItem() instanceof IDrinkContainer"
replace: "Ic2HostItems.drinkContainer($s) != null"
imports: ["ic2cextras.ported.compat.Ic2HostItems"]
confidence: 0.9
provenance: { source: agent, ref: "barrels closure port: host empty mug" }
tests:
  - context: "ItemStack s; import net.minecraft.world.item.ItemStack; import ic2.api.items.IDrinkContainer"
    before: "boolean b = s.getItem() instanceof IDrinkContainer;"
    after: "boolean b = Ic2HostItems.drinkContainer(s) != null;"
