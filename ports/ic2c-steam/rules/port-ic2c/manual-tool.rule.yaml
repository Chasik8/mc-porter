# ic2.core.utils.helpers.Tool on 1.7.10 (replaces the former patches/manual Tool.java).
# 1.19.2 harvest tools are block tags + tool tiers (TierSortingRegistry); on 1.7.10 they are block properties
# (Block.setHarvestLevel / getHarvestTool / getHarvestLevel). The tags themselves come from the generic adapter
# BlockTags (answered from those properties); only the tier half is IC2C-specific code here.
schemaVersion: 1
id: r-ic2c-manual-tool-registerblock
description: "Tool.ToolType#registerBlock: Block.setHarvestLevel (the enum constant names are Forge's tool classes) instead of block tag files"
from: forge-1.19.2
to: forge-1.7.10
kind: idiom
match:
  declaration: "ic2.core.utils.helpers.Tool$ToolType#registerBlock(net.minecraft.world.level.block.Block, int)"
edit:
  body: "\n            block.setHarvestLevel(this.name().toLowerCase(java.util.Locale.ROOT), level);\n        "
confidence: 0.9
provenance: { source: manual, ref: "patches/manual Tool.java (register)" }
tests:
  - before: "public final class Tool {\n    public static enum ToolType {\n        PICKAXE;\n        void registerBlock(Block block, int level) {\n            IC2Tags.registerTags(null, null, block);\n        }\n    }\n}"
    after: "public final class Tool {\n    public static enum ToolType {\n        PICKAXE;\n        void registerBlock(Block block, int level) {\n            block.setHarvestLevel(this.name().toLowerCase(java.util.Locale.ROOT), level);\n        }\n    }\n}"
---
