    after: "public final class Tool {\n    public static enum ToolType {\n        PICKAXE;\n        boolean isCorrectTool(BlockState state, int level) {\n            return BlockState.isIn(state, this.type) && state.getBlock().getHarvestLevel(state.getMeta()) <= level;\n        }\n    }\n}"
