# the closure frontier; these rules give the few members the closure needs alive a 1.7.10 value (IC2C service
# singletons -> the compat adapters of overlays/adapters, block entity types, tags, recipe registries). The members
# whose body/initializer comes from here are listed in install.stubs.keep. Tests are synthetic (only owner names are
# the mod's).
