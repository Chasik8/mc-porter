schemaVersion: 1
id: r-closure-mc-call-texturemanager-gettexture
description: "call net.minecraft.client.renderer.texture.TextureManager#getTexture(net.minecraft.resources.ResourceLocation) -> Textures.get($m, $a)"
from: forge-1.19.2
to: forge-1.7.10
kind: adapter
match:
  call: "net.minecraft.client.renderer.texture.TextureManager#getTexture(net.minecraft.resources.ResourceLocation)"
  bind: { recv: "$m", args: ["$a"] }
replace: "Textures.get($m, $a)"
imports: ["ic2cextras.ported.shim.mc.client.Textures"]
priority: 6
confidence: 0.9
provenance: { source: agent, ref: "closure-steam agent: one rule per distinct javac symbol; source = Mojang 1.19.2 mappings, target = MCP 1.7.10 / shim adapter" }
tests:
  - context: "TextureManager m; ResourceLocation a; import net.minecraft.client.renderer.texture.TextureManager; import net.minecraft.resources.ResourceLocation"
    before: "Object t = m.getTexture(a);"
    after: "Object t = Textures.get(m, a);"
