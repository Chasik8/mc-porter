# Barrels / drinks / refinery / whisky / Shaky: the IR of the barrels unit, selected from the whole-mod extract
# (porter select). Ids are IC2 Classic 2.1.3.4 registry names; the classes are its logic classes (relocated).
unit: barrels
modId: ic2
seed: '^ic2:(barrel|refinery|mug(_.+)?|glass(_.+)?|hops|whisky_grist|alcohol|whisky|shaky|bio_fuel|blazing_lava|woodgas)$'
customTypes: ['ic2:refining', 'ic2:potion_brew']
unknownFiles: [IC2Potions.java, IRefiningRecipeList.java, PotionBrewRegistry.java, BarrelTileEntity.java, RefineryTileEntity.java]
hostIds: [../rules/ids/ic2c-host-ids.forge-1.7.10.yaml]
hostKeep: []
relocate: ['ic2.=ic2cextras.ported.']
# framework classes shared by hundreds of objects: the generated base is used instead
generic: [ic2.core.item.base.IC2SimpleItem, ic2.core.fluid.IC2Fluid, ic2.core.entity.potion.SimpleEffect,
          ic2.core.block.machines.BaseMachineBlock, ic2.core.item.misc.CellItem, ic2.core.block.base.IC2Block, ic2.core.item.base.IC2BlockItem]
legacyNames: {from: 'ic2.', to: 'ic2cextras.', source: 'pilot-select:ns-camel(ic2cextras)'}
# IC2C draws the GUI of containers/<x>/<Name>Container with components/<x>/<Name>Component
screenConvention: {replace: [['.containers.', '.components.']], suffix: [Container, Component]}
overlay: barrels.overlay.yaml
