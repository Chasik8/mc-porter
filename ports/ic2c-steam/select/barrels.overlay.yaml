- file: "recipe"
  add:
    kind: "recipe"
    id: "ic2:barrel_brewing/beer_mug"
    recipeType: "custom"
    customType: "ic2:barrel_brewing"
    ingredients:
    - item: "minecraft:wheat"
    - item: "ic2:hops"
    - item: "ic2:mug"
    fluidIngredients:
    - fluid: "minecraft:water"
      amount: 1000
    result:
      item: "ic2:mug_beer"
    duration: 24000
    machines:
    - "ic2:barrel"
    notes:
    - "Up to 32 buckets of water, 64 wheat and 64 hops; the hops:wheat ratio sets\
      \ the strength"
    - "Ages while closed: quality rises after 1, 3, 9 and 27 in-game days"
    - "Tap with a treetap, then fill mugs or glasses"
    provenance:
      file: "java/ic2/core/block/misc/tiles/BarrelTileEntity.java"
      line: 0
      version: "forge-1.19.2"
      via: "manual"
