# Hand-written rules Forge 1.19.2 -> Forge 1.7.10 (10.13.4.1614, MCP stable_12). Every source member was
# checked against the Mojang 1.19.2 mappings, every target member against the MCP 1.7.10 jar (javap).
# Synthetic tests only. Generated from a compact spec; edit freely, keep one test per rule at least.
# Coordinates: BlockPos/Vec3i map onto the porter shim (dev.porter.shim.BlockPos), same method names.
schemaVersion: 1
id: r-1.19.2-1.7.10-type-blockpos
description: "1.7.10 has no position type; the thin porter shim mirrors the 1.19.2 BlockPos API."
from: forge-1.19.2
to: forge-1.7.10
kind: adapter
match:
  type: "net.minecraft.core.BlockPos"
replace: "dev.porter.shim.BlockPos"
preconditions: ["shim:blockpos"]
confidence: 0.95
provenance: { source: manual, ref: "manual: verified against Mojang 1.19.2 mappings and the MCP 1.7.10 jar (javap)" }
tests:
  - before: "import net.minecraft.core.BlockPos;"
    after: "import dev.porter.shim.BlockPos;"
  - name: "simple name stays (import is rewritten)"
    before: "BlockPos p = null;"
    after: "BlockPos p = null;"
---
