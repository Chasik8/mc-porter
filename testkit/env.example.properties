# porter testkit environment (copy to testkit/env.local.properties, or pass --env / $PORTER_TESTKIT_ENV).
# Replace every <...> placeholder: <cache> = $PORTER_CACHE, <jdk17>/<jdk8> = JDK homes, <minecraft-dir> = a launcher install.

# ---- Forge 1.19.2 (43.5.2) dedicated server, installed with: java -jar forge-1.19.2-43.5.2-installer.jar --installServer <dir>
forge-1.19.2.java=<jdk17>/bin/java
forge-1.19.2.server=<cache>/forge-1.19.2-server
forge-1.19.2.testmod=testkit/mod-1.19.2/build/portertestkit-1.19.2.jar
forge-1.19.2.heap=1500m

# ---- Forge 1.7.10 (10.13.4.1614) dedicated server, installed with the 1614 installer --installServer
#      (dir holds forge-1.7.10-10.13.4.1614-1.7.10-universal.jar, minecraft_server.1.7.10.jar, libraries/)
forge-1.7.10.java=<jdk8>/bin/java
forge-1.7.10.server=<cache>/forge-1.7.10-server
forge-1.7.10.testmod=testkit/mod-1.7.10/build/portertestkit-1.7.10.jar
forge-1.7.10.heap=1200m

# ---- Forge 1.7.10 client (GUI scenarios, side: client): a launcher-style install (version json + libraries)
forge-1.7.10.client.versionJson=<minecraft-dir>/versions/Forge 1.7.10/Forge 1.7.10.json
forge-1.7.10.client.libraries=<minecraft-dir>/libraries
forge-1.7.10.client.jar=<gradle-user-home>/caches/retro_futura_gradle/mc-vanilla/1.7.10/client.jar
forge-1.7.10.client.natives=<minecraft-dir>/versions/Forge 1.7.10/natives
forge-1.7.10.client.assets=<gradle-user-home>/caches/retro_futura_gradle/assets
forge-1.7.10.client.assetIndex=1.7.10

# ---- Forge 1.19.2 client (GUI scenarios): launcher-style install made by testkit/mod-1.19.2/setup-client.sh
forge-1.19.2.client.dir=<cache>/forge-1.19.2-client
forge-1.19.2.client.versionId=1.19.2-forge-43.5.2
# optional for both versions: client.window=offscreen|normal, client.guiScale=1
