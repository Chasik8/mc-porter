# Delta port: an addon over a base that already exists on the target version (every stage configured).
schemaVersion: 1
name: hostaddon-steam
description: Steam machines of a host mod's 1.19.2 version, as an addon to its 1.7.10 version.
mode: delta
from: forge-1.19.2
to: forge-1.7.10
vars:
  CACHE: /home/me/porter-cache
project: ../hostaddon
work: build/port-steam
queue: [bash, /home/me/bin/one-job-at-a-time.sh, porter]
jvmArgs: [-Xmx2g]
inputs:
  - name: host-1192
    mod: Host Mod
    version: "4.0"
    page: https://example.org/hostmod/files
    file: host-1.19.2-4.0.jar
    sha256: 0f0e0d0c0b0a09080706050403020100f0e0d0c0b0a09080706050403020100f
plugins: [build/host-extract-pack.jar]
classpath:
  file: build/porter-cp.txt
  exclude: [jabel]
  entries: ["${CACHE}/libs/fastutil-8.5.6.jar"]
setup:
  steps:
    - name: decompile
      porter: [decompile, --jar, "${INPUT_HOST_1192:-../downloads/host-1.19.2-4.0.jar}", --out, "${CACHE}/host-1.19.2-src"]
      creates: ["${CACHE}/host-1.19.2-src/java"]
    - name: cfr
      download: {url: "https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar", sha256: f686e8f3ded377d7bc87d216a90e9e9512df4156e75b06c655a16648ae8765b2, to: "${CACHE}/tools/cfr-0.152.jar"}
    - name: project
      copy: {from: project-files, to: ../hostaddon}
    - name: textures
      unzip: {zip: "${INPUT_HOST_1192:-../downloads/host-1.19.2-4.0.jar}", prefix: assets/host/textures/gui/, to: ../hostaddon/src/main/resources/assets/hostaddon/textures/gui, classes: false}
    - name: classpath
      command: [./gradlew, --no-daemon, -I, ../porter/scripts/gradle/porter-classpath.gradle, porterClasspath]
      cwd: ../hostaddon
      creates: [../hostaddon/build/porter-cp.txt]
derive:
  steps:
    - name: extract
      porter: [extract, --src, "${CACHE}/host-1.19.2-src", --version, "1.19.2", --out, build/ir-all]
    - name: select
      porter: [select, --ir, build/ir-all, --spec, steam.select.yaml, --out, steam/ir]
generate:
  units:
    - name: steam
      args: [--version, "1.7.10", --ir, steam/ir, --modid, hostaddon, --package, hostaddon.gen]
      exclude: [src/main/resources/assets/hostaddon/textures/unused.png]
  preserve: [src/main/java/hostaddon/gen/HostaddonGuiHandler.java]
closure:
  source: ../host-1.19.2-src/java
  prefixes: [host.]
  seeds: [host.machines.SteamBoilerBlockEntity, host.machines.SteamBoilerMenu]
  include: [host.recipes.FuelStrategy]
  cut: [host.registries., host.network.PacketHandler]
  drop: [host.compat.]
  stubExtra: [host.api.IHeatSource]
  known: [../host-1.7.10-src/java]
upfront:
  jar: ../host-1.19.2.jar
  data: ../porter/rules/upfront/1.19.2__1.7.10
  workers: 4
rewrite:
  rules: [../porter/rules/composite, ../porter/rules/packs/adapters, private-rules]
  graph: ["${CACHE}/graph/out"]
  platform: [host.]
  relocate: [host.=hostaddon.ported.]
  shimPackage: hostaddon.ported.shim
  jvmArgs: [-Xmx2g, -Xss16m]
patches:
  - name: logic
    after: generate
    patches: patches/logic
    base: "${CACHE}/host-1.19.2-src/java"
    target: ../hostaddon/src/main/java
install:
  stubs:
    overrides: hubs
    keep: [com.example.base.registry.Machines#create]
  srgMappings: "${CACHE}/graph/out/mappings/1.19.2.tiny"
  passes: [srgmoj, java8, tector, edits, assetns, imports]
  edits: edits.yaml
  assetNamespaces: [{from: host, to: hostaddon, paths: [textures/]}]
  adapters: bundled
  overlays: [manual, compat]
  langKeys:
    scan: src/main/java/hostaddon/ported
    pattern: '"(gui\.host\.[a-z0-9_.]+)"'
    source: "${CACHE}/host-1.19.2-src/res/assets/host/lang"
    target: src/main/resources/assets/hostaddon/lang
    locales: {en_us: en_US, ru_ru: ru_RU}
    marker: porter:lang-keys
loop:
  useClasspath: true
  args: [--runner, javac, --max-iter, "10", --shim, --rules, ../porter/rules/composite, --rules, ../porter/rules/packs/adapters]
compile:
  javaHome: /opt/jdk21
  jvmArgs: [-Xmx1500m]
  options: [--release, "8", -Xplugin:jabel]
  processorpath: ["${CACHE}/libs/jabel-javac-plugin-1.0.2.jar", "${CACHE}/libs/**/byte-buddy*.jar"]
  generatedSources:
    - path: hostaddon/Tags.java
      content: "package hostaddon;\npublic class Tags { public static final String VERSION = \"dev\"; }\n"
  castfixRounds: 3
build:
  command: [./gradlew, --no-daemon, build]
  env: { JAVA_HOME: /opt/jdk17 }
  jar: build/libs/hostaddon-1.0.jar
  obfcheckPrefix: hostaddon/
test:
  runs:
    - name: boiler-heatup
      args: [test, diff, --scenario, scenarios/boiler-heatup.scenario.yaml]
